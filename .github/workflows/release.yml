name: Release image

# Builds the production image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:<tag>   for a pushed tag such as v4.18.0
#   ghcr.io/<owner>/<repo>:latest  for the newest tag
#   ghcr.io/<owner>/<repo>:sha-<short sha> always
# Servers then deploy a tested, immutable image (LHC_IMAGE in .env) instead of
# building on the server. Run it by pushing a tag, or manually from the
# Actions tab for an ad-hoc build of a branch (no :latest).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry paths must be lower case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Live Helper Chat
            org.opencontainers.image.description=Live Helper Chat production image (php 8.3, apache)

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Deploy: set LHC_IMAGE to one of these in .env, then \`docker compose pull && docker compose up -d\`."
          } >> "$GITHUB_STEP_SUMMARY"
